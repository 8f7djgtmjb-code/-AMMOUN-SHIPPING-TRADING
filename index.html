<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMMOUN SHIPPING & TRADING</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 30px;
            font-size: 1.8rem;
        }
        .ship-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            margin: 20px auto;
            max-width: 500px;
            padding: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }
        .ship-card img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            display: block;
        }
        .ship-title {
            font-size: 1.3rem;
            color: #38bdf8;
            margin: 15px 0 8px 0;
            font-weight: bold;
        }
        .ship-info {
            color: #cbd5e1;
            font-size: 0.95rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <h1>AMMOUN SHIPPING & TRADING</h1>

    <!-- الباخرة الأولى -->
    <div class="ship-card">
        <img src="IMG_1935.jpeg" alt="الباخرة الأولى">
        <div class="ship-title">الباخرة الأولى</div>
        <div class="ship-info">تفاصيل الباخرة الأولى</div>
    </div>

    <!-- الباخرة الثانية -->
    <div class="ship-card">
        <img src="IMG_1970.jpeg" alt="الباخرة الثانية">
        <div class="ship-title">الباخرة الثانية</div>
        <div class="ship-info">تفاصيل الباخرة الثانية</div>
    </div>

    <!-- الباخرة الثالثة -->
    <div class="ship-card">
        <img src="IMG_1971.jpeg" alt="الباخرة الثالثة">
        <div class="ship-title">الباخرة الثالثة</div>
        <div class="ship-info">تفاصيل الباخرة الثالثة</div>
    </div>

</body>
</html>
