<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMMOUN SHIPPING & TRADING</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 30px;
            text-transform: uppercase;
        }
        .vessel-card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .vessel-title {
            font-size: 24px;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 5px;
        }
        .vessel-info {
            font-size: 18px;
            color: #cbd5e1;
            margin-bottom: 15px;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
        }
        .gallery img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #334155;
        }
    </style>
</head>
<body>

    <h1>AMMOUN SHIPPING & TRADING</h1>

    <div class="vessel-card">
        <div class="vessel-title">AL KAREEM ZAFER</div>
        <div class="vessel-info">Capacity: 7,500 DWT</div>
        <div class="gallery">
            <img src="IMG_1935.jpeg" alt="AL KAREEM ZAFER">
            <img src="IMG_1970.jpeg" alt="AL KAREEM ZAFER">
        </div>
    </div>

    <div class="vessel-card">
        <div class="vessel-title">PRINCESS EMAN</div>
        <div class="vessel-info">Capacity: 8,500 DWT</div>
        <div class="gallery">
            <img src="IMG_1971.jpeg" alt="PRINCESS EMAN">
            <img src="IMG_1972.jpeg" alt="PRINCESS EMAN">
        </div>
    </div>

    <div class="vessel-card">
        <div class="vessel-title">PRINCE ZAFER</div>
        <div class="vessel-info">Capacity: 7,900 DWT</div>
        <div class="gallery">
            <img src="IMG_1974.jpeg" alt="PRINCE ZAFER">
            <img src="IMG_1975.jpeg" alt="PRINCE ZAFER">
            <img src="IMG_1976.jpeg" alt="PRINCE ZAFER">
        </div>
    </div>

</body>
</html>
